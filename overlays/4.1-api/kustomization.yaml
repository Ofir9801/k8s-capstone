apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../4.0-data
  - deployment.yaml
  - service.yaml

# Runs the workloads as the todolist ServiceAccount (image-pull Secret), see the component.
components:
  - ../../components/todolist-sa

# Provided: a wait-for-db init container for the todolist-api Deployment. The patch adds
# it; the script it runs (wait-for-db.sh) is packed into the wait-for-db ConfigMap.
configMapGenerator:
  - name: wait-for-db
    namespace: todolist
    files:
      - wait-for-db.sh
patches:
  - path: wait-for-db-patch.yaml
