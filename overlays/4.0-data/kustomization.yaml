apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: todolist

resources:
  - ../../base
  - configmap.yaml
  - secret.yaml
  - mariadb-initdb-configmap.yaml
  - mariadb-statefulset.yaml
  - mariadb-service.yaml

# Runs the workloads as the todolist ServiceAccount (image-pull Secret), see the component.
components:
  - ../../components/todolist-sa
