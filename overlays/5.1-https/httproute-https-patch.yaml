# The app route (both / and /api/v1) now attaches only to the https listener. Without sectionName it
# would stay on the http listener too, and since /api/v1 is longer than the redirect's "/", plain
# HTTP to http://todolist.ofir9801.local/api/v1/todos would reach the API and skip the redirect.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: todolist
  namespace: todolist
spec:
  parentRefs:
    - name: todolist
      sectionName: https
