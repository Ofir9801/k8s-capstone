# The todolist ServiceAccount, with the regcred image-pull Secret attached, so private
# images pull without adding imagePullSecrets to each Deployment.
#
# Workloads don't name it themselves: the todolist-sa component
# (../components/todolist-sa) sets serviceAccountName: todolist on every Deployment,
# StatefulSet and Job of the stages that include it.
#
# Why not the namespace's `default` ServiceAccount? Kubernetes owns it: it creates `default`
# in every namespace and re-creates it when it is deleted, so `kubectl delete -k` would
# remove our pull Secret from it and the next apply would race the re-creation. Nothing
# else creates `todolist`.
#
# Neither the namespace nor the Secret is part of the project, so `kubectl delete -k` keeps
# both. The script creates the namespace (if needed) and the Secret:
#   ./scripts/create-ghcrio-secret -u <github-user> -p <token> -n todolist
# If it is missing, the kubelet only logs a warning and public images still pull.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: todolist
  namespace: todolist
imagePullSecrets:
  - name: regcred
