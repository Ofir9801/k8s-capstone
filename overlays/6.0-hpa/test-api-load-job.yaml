# Load test for the API autoscaler: 4 Pods x 16 threads call GET /todos for 3 minutes.
# Not in kustomization.yaml; start it with:
#   kubectl create -f overlays/6.0-hpa/test-api-load-job.yaml
# and watch: kubectl -n todolist get hpa todolist-api-hpa -w
# No scale-out on your machine? Raise parallelism (more Pods) or THREADS.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: test-api-load-
  namespace: todolist
  labels:
    app: todolist
    tier: test
spec:
  parallelism: 4
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: todolist
        tier: test
    spec:
      restartPolicy: Never
      containers:
        - name: load
          image: python:3.13-alpine
          env:
            - name: API_URL
              value: http://todolist-api:8080/todos
            - name: DURATION
              value: "180"
            - name: THREADS
              value: "16"
          command:
            - python
            - -c
            - |
              import os
              import threading
              import time
              import urllib.request

              url = os.environ["API_URL"]
              duration = int(os.environ["DURATION"])
              threads = int(os.environ["THREADS"])
              end = time.time() + duration
              ok = err = 0
              lock = threading.Lock()

              def work():
                  global ok, err
                  while time.time() < end:
                      try:
                          urllib.request.urlopen(url, timeout=5).read()
                          good = True
                      except Exception:
                          good = False
                      with lock:
                          if good:
                              ok += 1
                          else:
                              err += 1

              workers = [threading.Thread(target=work) for _ in range(threads)]
              for w in workers:
                  w.start()
              for w in workers:
                  w.join()
              print(f"{ok} requests ok, {err} errors, about {ok // duration} requests/s")
