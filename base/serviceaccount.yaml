# The todolist ServiceAccount, with the regcred image-pull Secret attached, so private
# images pull without adding imagePullSecrets to each Deployment.
#
# Workloads don't name it themselves: the todolist-sa component
# (../components/todolist-sa) sets serviceAccountName: todolist on every Deployment,
# StatefulSet and Job of the stages that include it.
#
# Why not the namespace's `default` ServiceAccount? Kubernetes creates `default` itself as
# soon as the namespace exists, so the first `kubectl apply -k` races it and fails with
# `serviceaccounts "default" already exists`. Nothing else creates `todolist`.
#
# The Secret itself is NOT part of the project: create it in the todolist namespace first,
#   ./scripts/create-ghcrio-secret -u <github-user> -p <token> -- -n todolist
# If it is missing, the kubelet only logs a warning and public images still pull.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: todolist
  namespace: todolist
imagePullSecrets:
  - name: regcred
