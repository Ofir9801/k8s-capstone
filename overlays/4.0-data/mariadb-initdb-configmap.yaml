apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-initdb
data:
  init-schema.sh: |
    #!/bin/bash
    set -e
    mariadb -uroot -p"$MYSQL_ROOT_PASSWORD" <<-EOSQL
      CREATE DATABASE IF NOT EXISTS \`$MYSQL_DATABASE\`;
      CREATE TABLE IF NOT EXISTS \`$MYSQL_DATABASE\`.\`$MYSQL_TABLE\` (
        id int NOT NULL AUTO_INCREMENT,
        task varchar(255) NOT NULL,
        status char(30),
        PRIMARY KEY (id)
      );
    EOSQL
